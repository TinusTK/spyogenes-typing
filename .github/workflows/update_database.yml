name: Update database (yearly)

# Once a year, 1 January 00:00 UTC (09:30 Darwin), or by hand from the
# Actions tab. Re-downloads every scheme in database/schemes.tsv, runs the
# tests and, if anything changed, opens a pull request to accept or reject.
# It never merges or releases anything by itself.
#
# Access: the PubMLST API is used without a login, so only data submitted up
# to 31 Dec 2024 comes down. Newer data may not be redistributed, so no key
# is used here; users get newer data on their own computer with
# `spyogenes-typing --setup`.
#
# The curated tables (database/tables/) are never downloaded: they are typed
# by hand from PubMLST's typing guide and the updater carries them over.
on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch:
    inputs:
      version_label:
        description: "Database version label (default PubMLST_YYYY-MM-DD)"
        required: false
      references:
        description: "Also rebuild references/ from NCBI (superantigens, M1 SNPs)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BLAST+ and pytest
        run: |
          sudo apt-get update && sudo apt-get install -y ncbi-blast+
          pip install pytest

      - name: Download and compare
        id: update
        run: |
          LABEL="${{ github.event.inputs.version_label }}"
          [ -z "$LABEL" ] && LABEL="PubMLST_$(date -u +%Y-%m-%d)"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          REFS=""
          [ "${{ github.event.inputs.references }}" = "true" ] && REFS="--references"
          set +e
          python scripts/update_database.py --db database $REFS \
            --summary "$RUNNER_TEMP/CHANGES_DB.md" --version-label "$LABEL"
          code=$?
          set -e
          if [ $code -eq 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT";
          else exit $code; fi

      # A database-only change keeps the tool version and raises +galaxyN
      # (MasterMind rule 8).
      - name: Raise the +galaxyN suffix
        if: steps.update.outputs.changed == 'true'
        run: |
          python - <<'EOF'
          import re
          p = "galaxywrapper/tool.xml"
          s = open(p).read()
          s = re.sub(r"\+galaxy(\d+)", lambda m: f"+galaxy{int(m.group(1)) + 1}", s, count=1)
          open(p, "w").write(s)
          EOF

      - name: Run the tests against the updated database
        if: steps.update.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: db-update/${{ steps.update.outputs.label }}
          commit-message: "Database update ${{ steps.update.outputs.label }}"
          author: TinusTK <20657379+TinusTK@users.noreply.github.com>
          committer: TinusTK <20657379+TinusTK@users.noreply.github.com>
          title: "Database update: ${{ steps.update.outputs.label }}"
          body-path: ${{ runner.temp }}/CHANGES_DB.md
          labels: database-update
          add-paths: |
            database/
            galaxywrapper/tool.xml
